# Electrical Trainer: nginx site config.
#
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile. The image's stock /etc/nginx/nginx.conf includes it
# inside `http {}`, so only http-level directives (temp paths, log_format, map) and one server {} belong here.
# Checked with `nginx -t` at image build time; exercised by deploy/smoke.sh in CI (there is no Docker on the dev box).
#
# What it does
#   * serves the Vite build from /usr/share/nginx/html with an SPA fallback to index.html for every other path
#   * /healthz answers 200 "ok" from nginx itself: no auth, never the SPA, not logged
#   * /assets/* (content-hashed by Vite) is cached for a year and marked immutable; a missing asset is a real 404
#   * index.html and /config.js (runtime config written at container start) are always revalidated (no-cache), so a
#     new deploy is picked up at once and a phone never runs a stale index.html against chunks that are gone
#   * gzip for text, and security headers including a CSP written for this app
#   * no /api: v1 has no backend
#
# Files written at container start (the image is never written to after the build, so it runs as uid 10005 on a
# read-only root file system; the start-up hooks in docker/ write to /tmp/et, a tmpfs on docker01):
#   /tmp/et/listen.conf   `listen <LISTEN_PORT>;` (8080 unless set)        docker/10-listen.sh
#   /tmp/et/config.js     served as /config.js                             docker/20-config.sh
# nginx's own scratch directories go there too (they default to /var/cache/nginx), and the Dockerfile moves the pid
# file to /tmp/nginx.pid. A missing listen.conf stops nginx from starting, so an image started without its hooks
# stays down rather than half up.
#
# Cookies: the platform's session cookie __Secure-sso* (Domain=.apps.mmcjcc.com) arrives on every request. This
# config never reads, sets, logs or forwards a cookie: nothing here uses $http_cookie or $cookie_*, the access log
# format below has no cookie field, and there is no proxy that could pass one on. The same goes for the platform's
# X-Auth-Request-* identity headers: not used, not logged.
#
# Note on add_header: nginx drops ALL inherited add_header lines the moment a location defines one of its own. So
# every header lives at server level (with `always`), no location has an add_header, and the per-path Cache-Control
# value comes from the map below.

client_body_temp_path /tmp/et/client_temp;
proxy_temp_path       /tmp/et/proxy_temp;
fastcgi_temp_path     /tmp/et/fastcgi_temp;
uwsgi_temp_path       /tmp/et/uwsgi_temp;
scgi_temp_path        /tmp/et/scgi_temp;

# Access log without cookies, identity headers or $remote_user. $remote_addr is Traefik's address on docker01; the
# client's is the first one in X-Forwarded-For.
log_format et_access '$remote_addr "$http_x_forwarded_for" [$time_local] "$request" $status $body_bytes_sent '
                     '$request_time "$http_referer" "$http_user_agent"';

# Cache-Control by status and path. Only a successful /assets/ answer is immutable for a year (304 too, so a
# revalidation never downgrades the cached copy); everything else, a 404 under /assets/ included, is revalidated.
map "$status:$uri" $et_cache_control {
    default                        "no-cache";
    "~^(200|206|304):/assets/"     "public, max-age=31536000, immutable";
}

server {
    include /tmp/et/listen.conf;           # listen <LISTEN_PORT>;  (8080 unless set)
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens     off;
    absolute_redirect off;                 # keep any redirect relative: TLS ends at Traefik in front
    access_log        /var/log/nginx/access.log et_access;   # the stock image links this file to stdout

    # ---- compression ------------------------------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;                   # Traefik always sits in front; compress anyway
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json
                    application/manifest+json image/svg+xml;
    # text/html is always gzipped; woff/woff2 are compressed already.

    # ---- headers, once, server-wide (see the note at the top) -------------------------------------------------
    # Traefik's secure-headers middleware on docker01 adds HSTS, nosniff, X-Frame-Options DENY, a referrer policy
    # and a permissions policy as well; the values here agree with it, so the image is just as strict when it runs
    # alone (CI, a local docker run). The platform sets no CSP: that one is the app's own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $et_cache_control always;
    # Content-Security-Policy, written for this stack (Vite + React + Tailwind, Inter bundled with the app):
    #   script-src 'self'                       the production index.html has no inline script, and nothing in the
    #                                           app needs eval (deploy/smoke.sh fails on an inline <script>)
    #   style-src 'unsafe-inline'               inline style attributes
    #   font-src 'self'                         Inter's woff2 files are Vite assets (src/assets/fonts/inter): no font CDN,
    #                                           so the app loads nothing from another origin
    #   img-src data:                           Vite inlines small images as data: URIs
    #   connect-src 'self'                      no API in v1; everything else stays on this origin
    # If the app renders blank after a deploy, open the browser console: a CSP block reads "Refused to ..." and
    # names the directive to loosen. A Sign out link to auth.apps.mmcjcc.com is a plain navigation, which the CSP
    # does not restrict (form-action would, so the app must not POST a form there).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- health: answered by nginx itself (the manifest's `health`, the image's HEALTHCHECK) ------------------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- runtime config for the SPA, written at container start by docker/20-config.sh ------------------------
    location = /config.js {
        root /tmp/et;
    }

    # ---- the web app manifest, with its own type whatever the base image's mime.types knows -------------------
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # ---- Vite's hashed bundles: a missing chunk is a real 404, never index.html -------------------------------
    location /assets/ {
        try_files $uri =404;
    }

    # ---- SPA: real files first (index.html, favicon.svg), else index.html ------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
